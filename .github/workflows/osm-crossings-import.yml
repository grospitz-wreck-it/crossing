name: OSM crossings import

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN OSM IMPORT to resolve missing OSM links from the existing local network'
        required: true
        type: string
      source_branch:
        description: 'Branch whose resolver code should run'
        required: true
        default: 'fix/osm-track-specific-crossing-forecasts'
        type: string

permissions:
  contents: read

concurrency:
  group: osm-crossings-import
  cancel-in-progress: false

jobs:
  import:
    name: Resolve missing crossing infrastructure from local OSM data
    if: github.ref == 'refs/heads/fix/osm-track-specific-crossing-forecasts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "RUN OSM IMPORT" ]; then
            echo "::error::Confirmation did not match. No database changes were made."
            exit 1
          fi

      - name: Check out explicitly selected source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Resolve missing OSM links and multi-track corridors from local data
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::error::GitHub repository secrets TURSO_DATABASE_URL and/or TURSO_AUTH_TOKEN are missing."
            exit 1
          fi
          node scripts/osm/resolve-local-crossing-links.mjs
